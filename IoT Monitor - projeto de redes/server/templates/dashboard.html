<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Monitor — Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg0: #080c14; --bg1: #0f1520; --bg2: #172033; --bg3: #1c2842;
            --border: #253352; --glow: #3b82f618;
            --t1: #e8edf5; --t2: #8494ad; --t3: #4a5b75;
            --blue: #3b82f6; --green: #10b981; --yellow: #f59e0b;
            --red: #ef4444; --cyan: #06b6d4; --purple: #8b5cf6;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Outfit',sans-serif; background:var(--bg0); color:var(--t1); min-height:100vh; }
        body::after { content:''; position:fixed; inset:0; background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.02'/%3E%3C/svg%3E"); pointer-events:none; z-index:9999; }
        ::-webkit-scrollbar { width:3px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

        /* LOGIN */
        #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh;
            background:radial-gradient(ellipse at 30% 40%,#1e3a5f18 0%,transparent 60%); }
        .login-box { background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:44px 36px; width:380px;
            box-shadow:0 20px 60px #0008,0 0 60px var(--glow); }
        .login-box h1 { font-family:'JetBrains Mono',monospace; font-size:1.4rem; font-weight:700; color:var(--blue); margin-bottom:2px; }
        .login-box .sub { font-size:.78rem; color:var(--t3); margin-bottom:28px; font-family:'JetBrains Mono',monospace; }
        .ig { margin-bottom:14px; }
        .ig label { display:block; font-size:.65rem; font-weight:600; color:var(--t2); margin-bottom:5px; text-transform:uppercase; letter-spacing:1.2px; }
        .ig input { width:100%; padding:11px 14px; background:var(--bg1); border:1px solid var(--border); border-radius:8px;
            color:var(--t1); font-family:'JetBrains Mono',monospace; font-size:.85rem; outline:none; transition:border .2s,box-shadow .2s; }
        .ig input:focus { border-color:var(--blue); box-shadow:0 0 0 3px #3b82f620; }
        .brow { display:flex; gap:10px; margin-top:22px; }
        .btn { flex:1; padding:11px; border-radius:8px; font-family:'Outfit',sans-serif; font-weight:600; font-size:.88rem; cursor:pointer; transition:all .2s; border:1px solid var(--border); }
        .bp { background:var(--blue); color:#fff; border-color:var(--blue); }
        .bp:hover { background:#2563eb; box-shadow:0 0 18px #3b82f630; }
        .bs { background:transparent; color:var(--t2); } .bs:hover { background:var(--bg1); color:var(--t1); }
        #login-error { color:var(--red); font-size:.78rem; margin-top:10px; font-family:'JetBrains Mono',monospace; display:none; }

        /* TOPBAR */
        #dashboard { display:none; }
        .topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 24px;
            background:var(--bg1); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
        .topbar-l { display:flex; align-items:center; gap:14px; }
        .topbar h1 { font-family:'JetBrains Mono',monospace; font-size:1rem; font-weight:700; color:var(--blue); }
        .badge-ws { display:flex; align-items:center; gap:5px; font-size:.7rem; font-family:'JetBrains Mono',monospace;
            color:var(--green); padding:3px 10px; background:#10b98112; border-radius:16px; border:1px solid #10b98125; }
        .dot { width:5px; height:5px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
        .topbar-r { display:flex; align-items:center; gap:14px; }
        .uinfo { font-size:.75rem; color:var(--t2); font-family:'JetBrains Mono',monospace; }
        .bsm { padding:5px 12px; font-size:.7rem; border-radius:5px; background:transparent; border:1px solid var(--border);
            color:var(--t2); cursor:pointer; font-family:'Outfit',sans-serif; font-weight:600; transition:all .2s; }
        .bsm:hover { border-color:var(--red); color:var(--red); }
        .bsm.sim { border-color:var(--green); color:var(--green); }
        .bsm.sim:hover { background:#10b98115; }

        /* STATS */
        .sbar { display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--border); border-bottom:1px solid var(--border); }
        .si { background:var(--bg1); padding:14px 20px; }
        .sl { font-size:.6rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--t3); margin-bottom:3px; font-family:'JetBrains Mono',monospace; }
        .sv { font-family:'JetBrains Mono',monospace; font-size:1.4rem; font-weight:700; }

        /* GRID */
        .grid { display:grid; grid-template-columns:1fr 1fr 320px; gap:1px; background:var(--border); min-height:calc(100vh - 128px); }
        .pn { background:var(--bg0); display:flex; flex-direction:column; }
        .ph { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); background:var(--bg1); }
        .pt { font-family:'JetBrains Mono',monospace; font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:1.5px; color:var(--t2); }
        .pb { padding:14px 18px; flex:1; overflow-y:auto; }
        .blv { font-family:'JetBrains Mono',monospace; font-size:.65rem; padding:2px 7px; border-radius:3px; background:#ef444412; color:var(--red); border:1px solid #ef444425; animation:pulse 2s infinite; }

        /* TABS */
        .tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg1); }
        .tb { padding:9px 14px; font-size:.65rem; font-family:'JetBrains Mono',monospace; font-weight:600; text-transform:uppercase;
            letter-spacing:1px; background:none; border:none; border-bottom:2px solid transparent; color:var(--t3); cursor:pointer; transition:all .2s; }
        .tb.a { color:var(--blue); border-bottom-color:var(--blue); }
        .tb:hover:not(.a) { color:var(--t2); }
        .tc { display:none; } .tc.a { display:block; }

        /* CHART */
        .cc { position:relative; width:100%; height:260px; margin-bottom:12px; }

        /* SENSOR CARDS */
        .sg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
        .sc { padding:12px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; text-align:center; transition:all .3s; }
        .sc:hover { border-color:var(--blue); box-shadow:0 0 12px var(--glow); }
        .sc-icon { font-size:1.3rem; }
        .sc-name { font-family:'JetBrains Mono',monospace; font-size:.65rem; color:var(--t2); }
        .sc-val { font-family:'JetBrains Mono',monospace; font-size:1.3rem; font-weight:700; margin:3px 0; }
        .sc-loc { font-size:.6rem; color:var(--t3); }

        /* FEED */
        .fi { padding:10px 14px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; background:var(--bg2); animation:si .3s ease-out; }
        @keyframes si { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
        .fh { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
        .fs { font-family:'JetBrains Mono',monospace; font-size:.75rem; font-weight:600; }
        .fp { font-family:'JetBrains Mono',monospace; font-size:.55rem; padding:2px 5px; border-radius:3px; text-transform:uppercase; }
        .fp-h { background:#3b82f618; color:var(--blue); } .fp-u { background:#10b98118; color:var(--green); } .fp-w { background:#8b5cf618; color:var(--purple); }
        .fv { font-family:'JetBrains Mono',monospace; font-size:1.2rem; font-weight:700; }
        .ft { font-size:.65rem; color:var(--t3); font-family:'JetBrains Mono',monospace; }

        /* ALERTS */
        .ai { padding:9px 12px; border-radius:6px; margin-bottom:5px; font-size:.75rem; font-family:'JetBrains Mono',monospace; animation:si .3s ease-out; }
        .ai-c { background:#ef444410; border:1px solid #ef444425; color:#fca5a5; }
        .ai-w { background:#f59e0b10; border:1px solid #f59e0b25; color:#fcd34d; }

        /* RTT TABLE */
        .rt { width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:.7rem; }
        .rt th { text-align:left; padding:7px 8px; color:var(--t3); font-weight:500; text-transform:uppercase; font-size:.6rem; letter-spacing:1px; border-bottom:1px solid var(--border); }
        .rt td { padding:7px 8px; border-bottom:1px solid #172033; }
        .rb { height:3px; border-radius:2px; background:var(--border); overflow:hidden; margin-top:3px; }
        .rbf { height:100%; border-radius:2px; transition:width .5s; }

        @media(max-width:1100px){ .grid{grid-template-columns:1fr 1fr;} }
        @media(max-width:700px){ .grid{grid-template-columns:1fr;} .sbar{grid-template-columns:repeat(3,1fr);} }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
    <div class="login-box">
        <h1>◆ IoT Monitor</h1>
        <div class="sub">Plataforma de Monitoramento em Tempo Real</div>
        <div class="ig"><label>Usuário</label><input type="text" id="login-user" placeholder="operador01" autocomplete="off"></div>
        <div class="ig"><label>Senha</label><input type="password" id="login-pass" placeholder="••••••••"></div>
        <div class="brow">
            <button class="btn bs" onclick="registrar()">Registrar</button>
            <button class="btn bp" onclick="doLogin()">Entrar</button>
        </div>
        <div id="login-error"></div>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
    <div class="topbar">
        <div class="topbar-l">
            <h1>◆ IoT Monitor</h1>
            <div class="badge-ws" id="ws-badge"><span class="dot"></span><span id="ws-txt">Conectando...</span></div>
        </div>
        <div class="topbar-r">
            <button class="bsm sim" id="btn-sim" onclick="toggleSim()">▶ Simular</button>
            <span class="uinfo" id="user-disp"></span>
            <button class="bsm" onclick="logout()">Sair</button>
        </div>
    </div>

    <div class="sbar">
        <div class="si"><span class="sl">Sensores</span><span class="sv" style="color:var(--blue)" id="s-sens">0</span></div>
        <div class="si"><span class="sl">Leituras</span><span class="sv" style="color:var(--green)" id="s-leit">0</span></div>
        <div class="si"><span class="sl">Alertas</span><span class="sv" style="color:var(--yellow)" id="s-alert">0</span></div>
        <div class="si"><span class="sl">RTT Médio</span><span class="sv" style="color:var(--cyan)" id="s-rtt">—</span></div>
        <div class="si"><span class="sl">Conexões WS</span><span class="sv" style="color:var(--purple)" id="s-ws">0</span></div>
    </div>

    <div class="grid">
        <!-- COL 1: CHARTS -->
        <div class="pn">
            <div class="ph"><span class="pt">📊 Gráficos</span><span class="blv">● LIVE</span></div>
            <div class="tabs">
                <button class="tb a" onclick="stab('t-temp',this)">Temperatura</button>
                <button class="tb" onclick="stab('t-umid',this)">Umidade</button>
                <button class="tb" onclick="stab('t-rtt',this)">RTT</button>
            </div>
            <div class="pb">
                <div id="t-temp" class="tc a"><div class="cc"><canvas id="c-temp"></canvas></div></div>
                <div id="t-umid" class="tc"><div class="cc"><canvas id="c-umid"></canvas></div></div>
                <div id="t-rtt" class="tc">
                    <div class="cc"><canvas id="c-rtt"></canvas></div>
                    <div style="font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px;">Comparação de Protocolos</div>
                    <table class="rt"><thead><tr><th>Proto</th><th>Médio</th><th>Mín</th><th>Máx</th><th style="width:60px"></th></tr></thead>
                    <tbody>
                        <tr><td style="color:var(--blue)">HTTP</td><td id="rh-a">—</td><td id="rh-n">—</td><td id="rh-x">—</td><td><div class="rb"><div class="rbf" id="rh-b" style="width:0;background:var(--blue)"></div></div></td></tr>
                        <tr><td style="color:var(--purple)">WS</td><td id="rw-a">—</td><td id="rw-n">—</td><td id="rw-x">—</td><td><div class="rb"><div class="rbf" id="rw-b" style="width:0;background:var(--purple)"></div></div></td></tr>
                    </tbody></table>
                </div>
                <div style="font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;">Sensores</div>
                <div class="sg" id="sg"></div>
            </div>
        </div>

        <!-- COL 2: FEED -->
        <div class="pn">
            <div class="ph"><span class="pt">⚡ Feed ao Vivo</span><span class="blv">● LIVE</span></div>
            <div class="pb" id="feed" style="max-height:calc(100vh - 190px);">
                <div style="text-align:center;padding:36px;color:var(--t3);font-family:'JetBrains Mono',monospace;font-size:.75rem;">Aguardando leituras...</div>
            </div>
        </div>

        <!-- COL 3: ALERTS + CHAT -->
        <div class="pn">
            <div class="ph"><span class="pt">🔔 Alertas</span><span id="a-badge" style="font-family:'JetBrains Mono',monospace;font-size:.65rem;padding:2px 7px;border-radius:4px;background:#f59e0b12;color:var(--yellow);border:1px solid #f59e0b25;">0</span></div>
            <div class="tabs">
                <button class="tb a" onclick="stab('t-alerts',this)">Alertas</button>
                <button class="tb" onclick="stab('t-chat',this)">Chat</button>
                <button class="tb" onclick="stab('t-logs',this)">Logs</button>
            </div>
            <div class="pb" style="max-height:calc(100vh - 250px);">
                <div id="t-alerts" class="tc a"><div id="alerts-box"><div style="text-align:center;padding:24px;color:var(--t3);font-size:.75rem;font-family:'JetBrains Mono',monospace;">Nenhum alerta</div></div></div>
                <div id="t-chat" class="tc">
                    <div id="chat-box" style="min-height:180px;margin-bottom:8px;"></div>
                    <div style="display:flex;gap:5px;">
                        <input type="text" id="chat-in" placeholder="Mensagem..." style="flex:1;padding:7px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:5px;color:var(--t1);font-family:'JetBrains Mono',monospace;font-size:.75rem;outline:none;" onkeydown="if(event.key==='Enter')sendChat()">
                        <button class="bsm" style="border-color:var(--blue);color:var(--blue);" onclick="sendChat()">→</button>
                    </div>
                </div>
                <div id="t-logs" class="tc"><div id="logs-box" style="font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--t3);white-space:pre-wrap;line-height:1.5;"></div></div>
            </div>
        </div>
    </div>
</div>

<script>
let TOKEN='',USER='',sock=null,sensores=[],nLeit=0,nAlert=0,feedN=0;
const MF=40,MC=30,rtt={http:[],ws:[]};
let cT,cU,cR,dsMap={},simOn=false,simIv=null;

// === CHARTS ===
const cOpts=(u)=>({responsive:true,maintainAspectRatio:false,animation:{duration:300},
    plugins:{legend:{labels:{color:'#8494ad',font:{family:'JetBrains Mono',size:9}}}},
    scales:{x:{ticks:{color:'#4a5b75',font:{family:'JetBrains Mono',size:8},maxTicksLimit:8},grid:{color:'#17203320'}},
            y:{ticks:{color:'#4a5b75',font:{family:'JetBrains Mono',size:9}},grid:{color:'#17203340'},title:{display:true,text:u,color:'#8494ad'}}}});

function initC(){
    cT=new Chart(document.getElementById('c-temp'),{type:'line',data:{labels:[],datasets:[]},options:cOpts('°C')});
    cU=new Chart(document.getElementById('c-umid'),{type:'line',data:{labels:[],datasets:[]},options:cOpts('%')});
    cR=new Chart(document.getElementById('c-rtt'),{type:'line',data:{labels:[],datasets:[
        {label:'HTTP/TCP',data:[],borderColor:'#3b82f6',backgroundColor:'#3b82f610',tension:.3,pointRadius:2,borderWidth:2},
        {label:'WebSocket',data:[],borderColor:'#8b5cf6',backgroundColor:'#8b5cf610',tension:.3,pointRadius:2,borderWidth:2}
    ]},options:cOpts('ms')});
}

const palette=['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#06b6d4','#ec4899','#14b8a6'];
function getDS(ch,name,sid,col){const k=ch.canvas.id+'_'+sid;if(dsMap[k]!==undefined)return dsMap[k];
    const i=ch.data.datasets.length;ch.data.datasets.push({label:name,data:[],borderColor:col,backgroundColor:col+'18',tension:.3,pointRadius:2,borderWidth:2,fill:true});dsMap[k]=i;return i;}
function addPt(ch,lbl,di,v){if(!ch.data.labels.length||ch.data.labels[ch.data.labels.length-1]!==lbl){ch.data.labels.push(lbl);ch.data.datasets.forEach((d,i)=>{if(i!==di)d.data.push(null)});}
    ch.data.datasets[di].data.push(v);if(ch.data.labels.length>MC){ch.data.labels.shift();ch.data.datasets.forEach(d=>d.data.shift());}ch.update('none');}

// === AUTH ===
function showErr(m){const e=document.getElementById('login-error');e.textContent=m;e.style.display='block';}
async function api(m,p,b=null){const o={method:m,headers:{'Content-Type':'application/json'}};if(TOKEN)o.headers['Authorization']='Bearer '+TOKEN;if(b)o.body=JSON.stringify(b);const r=await fetch(p,o);return{s:r.status,d:await r.json()};}
async function doLogin(){const u=document.getElementById('login-user').value.trim(),p=document.getElementById('login-pass').value;if(!u||!p)return showErr('Preencha todos os campos');
    try{const r=await api('POST','/api/login',{username:u,password:p});if(r.s===200){TOKEN=r.d.token;USER=u;enter();}else showErr(r.d.erro||'Erro');}catch(e){showErr('Erro de conexão');}}
async function registrar(){const u=document.getElementById('login-user').value.trim(),p=document.getElementById('login-pass').value;if(!u||!p)return showErr('Preencha todos os campos');
    try{const r=await api('POST','/api/registrar',{username:u,password:p});if(r.s===201){TOKEN=r.d.token;USER=u;enter();}else showErr(r.d.erro||'Erro');}catch(e){showErr('Erro de conexão');}}
function logout(){TOKEN='';USER='';if(sock)sock.disconnect();document.getElementById('dashboard').style.display='none';document.getElementById('login-screen').style.display='flex';}
document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// === ENTER ===
async function enter(){document.getElementById('login-screen').style.display='none';document.getElementById('dashboard').style.display='block';
    document.getElementById('user-disp').textContent=USER;initC();await loadSensors();await loadAlerts();connectWS();startRTT();log('Sistema inicializado');log('Usuário: '+USER);}

// === SENSORES ===
async function loadSensors(){const r=await api('GET','/api/sensores');sensores=r.d;document.getElementById('s-sens').textContent=sensores.length;
    if(!sensores.length){const defs=[{nome:'Temp-Lab01',tipo:'temperatura',localizacao:'Laboratório 1'},{nome:'Umid-Lab01',tipo:'umidade',localizacao:'Laboratório 1'},{nome:'Temp-Ext',tipo:'temperatura',localizacao:'Área Externa'}];
        for(const s of defs){const c=await api('POST','/api/sensores',s);if(c.s===201)sensores.push({id:c.d.sensor_id,...s});}document.getElementById('s-sens').textContent=sensores.length;log(sensores.length+' sensores criados');}
    renderSC();}

function renderSC(){document.getElementById('sg').innerHTML=sensores.map(s=>{const ic=s.tipo==='temperatura'?'🌡️':s.tipo==='umidade'?'💧':'📊';
    return `<div class="sc" id="sc-${s.id}"><div class="sc-icon">${ic}</div><div class="sc-name">${s.nome}</div><div class="sc-val" id="sv-${s.id}">—</div><div class="sc-loc">${s.localizacao||''}</div></div>`;}).join('');}

// === ALERTS ===
async function loadAlerts(){const r=await api('GET','/api/alertas');if(r.d.length){const c=document.getElementById('alerts-box');c.innerHTML='';r.d.slice(0,20).forEach(a=>addAlertUI(a.mensagem,a.nivel,a.timestamp));
    nAlert=r.d.length;document.getElementById('s-alert').textContent=nAlert;document.getElementById('a-badge').textContent=nAlert;}}
function addAlertUI(msg,niv,ts){const c=document.getElementById('alerts-box');if(c.querySelector('div[style]')&&c.children.length===1)c.innerHTML='';
    const e=document.createElement('div');e.className='ai ai-'+(niv==='critical'?'c':'w');const t=ts?new Date(ts).toLocaleTimeString('pt-BR'):new Date().toLocaleTimeString('pt-BR');
    e.innerHTML=`<div>${msg}</div><div style="font-size:.6rem;color:var(--t3);margin-top:3px">${t}</div>`;c.prepend(e);while(c.children.length>30)c.lastChild.remove();}

// === FEED ===
function addFeed(d){const c=document.getElementById('feed');if(!feedN)c.innerHTML='';feedN++;nLeit++;document.getElementById('s-leit').textContent=nLeit;
    const e=document.createElement('div');e.className='fi';const pc=d.protocolo==='HTTP'?'fp-h':d.protocolo==='UDP'?'fp-u':'fp-w';
    const t=new Date().toLocaleTimeString('pt-BR');const col=d.tipo==='temperatura'?(d.valor>40||d.valor<10?'var(--red)':'var(--t1)'):(d.valor>80||d.valor<20?'var(--yellow)':'var(--t1)');
    e.innerHTML=`<div class="fh"><span class="fs">${d.sensor_nome||'S'+d.sensor_id}</span><span class="fp ${pc}">${d.protocolo}</span></div>
        <span class="fv" style="color:${col}">${d.valor}${d.unidade}</span>
        <div style="display:flex;justify-content:space-between;margin-top:3px"><span class="ft">${t}</span>${d.rtt_ms?`<span class="ft">RTT:${d.rtt_ms}ms</span>`:''}</div>`;
    c.prepend(e);while(c.children.length>MF)c.lastChild.remove();
    const v=document.getElementById('sv-'+d.sensor_id);if(v)v.textContent=d.valor+d.unidade;
    const tl=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const sc=palette[(d.sensor_id-1)%palette.length];
    if(d.tipo==='temperatura'){const i=getDS(cT,d.sensor_nome||'S'+d.sensor_id,d.sensor_id,sc);addPt(cT,tl,i,d.valor);}
    else if(d.tipo==='umidade'){const i=getDS(cU,d.sensor_nome||'S'+d.sensor_id,d.sensor_id,sc);addPt(cU,tl,i,d.valor);}}

// === WEBSOCKET ===
function connectWS(){sock=io({transports:['websocket','polling']});
    sock.on('connect',()=>{document.getElementById('ws-txt').textContent='Conectado';sock.emit('inscrever',{canal:'leituras'});sock.emit('inscrever',{canal:'alertas'});
        sensores.forEach(s=>sock.emit('inscrever',{canal:'sensor_'+s.id}));log('WebSocket conectado');});
    sock.on('disconnect',()=>{const b=document.getElementById('ws-badge');b.style.color='var(--red)';b.querySelector('.dot').style.background='var(--red)';document.getElementById('ws-txt').textContent='Desconectado';log('WebSocket desconectado');});
    sock.on('nova_leitura',d=>addFeed(d));
    sock.on('novo_alerta',d=>{nAlert++;document.getElementById('s-alert').textContent=nAlert;document.getElementById('a-badge').textContent=nAlert;addAlertUI(d.mensagem,d.nivel,d.timestamp);log('⚠ '+d.mensagem);});
    sock.on('ws_pong',d=>{if(d.timestamp_cliente){const r=(Date.now()/1000-d.timestamp_cliente)*1000;rtt.ws.push(r);if(rtt.ws.length>50)rtt.ws.shift();updRTT();
        const t=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});cR.data.labels.push(t);cR.data.datasets[1].data.push(+r.toFixed(2));
        if(cR.data.datasets[0].data.length<cR.data.labels.length)cR.data.datasets[0].data.push(null);if(cR.data.labels.length>MC){cR.data.labels.shift();cR.data.datasets.forEach(d=>d.data.shift());}cR.update('none');}});
    sock.on('chat_nova_mensagem',d=>addChat(d.usuario,d.mensagem,d.timestamp));
    sock.on('ws_stats',d=>{document.getElementById('s-ws').textContent=d.conexoes_ativas||0;});
    sock.on('erro',d=>log('ERRO: '+d.mensagem));
    setInterval(()=>{if(sock&&sock.connected)sock.emit('solicitar_stats');},5000);}

// === RTT ===
function startRTT(){setInterval(rttHTTP,5000);setInterval(rttWS,3000);setTimeout(rttHTTP,500);setTimeout(rttWS,1000);}
async function rttHTTP(){const t=performance.now();try{await fetch('/api/ping');const r=performance.now()-t;rtt.http.push(r);if(rtt.http.length>50)rtt.http.shift();updRTT();
    const l=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});cR.data.labels.push(l);cR.data.datasets[0].data.push(+r.toFixed(2));
    if(cR.data.datasets[1].data.length<cR.data.labels.length)cR.data.datasets[1].data.push(null);if(cR.data.labels.length>MC){cR.data.labels.shift();cR.data.datasets.forEach(d=>d.data.shift());}cR.update('none');}catch(e){}}
function rttWS(){if(sock&&sock.connected)sock.emit('ws_ping',{timestamp:Date.now()/1000,seq:rtt.ws.length});}
function updRTT(){const c=a=>{if(!a.length)return null;return{a:(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2),n:Math.min(...a).toFixed(2),x:Math.max(...a).toFixed(2)};};
    const h=c(rtt.http),w=c(rtt.ws);
    if(h){document.getElementById('rh-a').textContent=h.a+'ms';document.getElementById('rh-n').textContent=h.n+'ms';document.getElementById('rh-x').textContent=h.x+'ms';}
    if(w){document.getElementById('rw-a').textContent=w.a+'ms';document.getElementById('rw-n').textContent=w.n+'ms';document.getElementById('rw-x').textContent=w.x+'ms';}
    const all=[...rtt.http,...rtt.ws];if(all.length)document.getElementById('s-rtt').textContent=(all.reduce((a,b)=>a+b,0)/all.length).toFixed(1)+'ms';
    const mx=Math.max(h?+h.a:0,w?+w.a:0,1);if(h)document.getElementById('rh-b').style.width=(+h.a/mx*100)+'%';if(w)document.getElementById('rw-b').style.width=(+w.a/mx*100)+'%';}

// === SIMULATION ===
function toggleSim(){const b=document.getElementById('btn-sim');if(simOn){clearInterval(simIv);simIv=null;simOn=false;b.textContent='▶ Simular';log('Simulação parada');}
    else{simOn=true;b.textContent='⏸ Parar';log('Simulação iniciada');
        simIv=setInterval(()=>{if(!sock||!sock.connected)return;const s=sensores[Math.floor(Math.random()*sensores.length)];
            let v,u;if(s.tipo==='temperatura'){v=+(Math.random()*35+8).toFixed(1);u='°C';}else{v=+(Math.random()*70+15).toFixed(1);u='%';}
            sock.emit('enviar_leitura',{token:TOKEN,sensor_id:s.id,valor:v,unidade:u,sensor_nome:s.nome,timestamp_envio:Date.now()/1000,seq:nLeit});},1500);}}

// === CHAT ===
function sendChat(){const i=document.getElementById('chat-in'),m=i.value.trim();if(!m||!sock)return;sock.emit('chat_mensagem',{usuario:USER,mensagem:m});i.value='';}
function addChat(u,m,ts){const c=document.getElementById('chat-box'),t=ts?new Date(ts).toLocaleTimeString('pt-BR'):new Date().toLocaleTimeString('pt-BR'),me=u===USER;
    const e=document.createElement('div');e.style.cssText=`margin-bottom:6px;padding:7px 10px;border-radius:7px;font-size:.75rem;background:${me?'#3b82f612':'var(--bg2)'};border:1px solid ${me?'#3b82f625':'var(--border)'};`;
    e.innerHTML=`<div style="font-family:'JetBrains Mono',monospace;font-size:.6rem;color:${me?'var(--blue)':'var(--t3)'};margin-bottom:2px">${u} · ${t}</div><div>${m}</div>`;c.appendChild(e);c.scrollTop=c.scrollHeight;}

// === LOGS ===
function log(m){const e=document.getElementById('logs-box'),t=new Date().toLocaleTimeString('pt-BR');e.textContent=`[${t}] ${m}\n`+e.textContent;const l=e.textContent.split('\n');if(l.length>80)e.textContent=l.slice(0,80).join('\n');}

// === TABS ===
function stab(id,btn){btn.parentElement.querySelectorAll('.tb').forEach(b=>b.classList.remove('a'));btn.classList.add('a');
    const t=document.getElementById(id);if(t){t.parentElement.querySelectorAll('.tc').forEach(c=>c.classList.remove('a'));t.classList.add('a');}}
</script>
